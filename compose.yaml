x-backend: &backend
  build: .
  image: mytikas-local
  init: true
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-mytikas}:${POSTGRES_PASSWORD:?Run npm run secrets}@db:5432/${POSTGRES_DB:-mytikas}
    SESSION_SECRET: ${SESSION_SECRET:?Run npm run secrets}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    PORT: 8080
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  restart: unless-stopped
  stop_grace_period: 45s
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mytikas}
      POSTGRES_DB: ${POSTGRES_DB:-mytikas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run secrets}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
