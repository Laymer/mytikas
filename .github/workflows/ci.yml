name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: for file in mytikas.sh mytikas-machine.sh; do bash -n "$file" || exit 1; done
      - run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d mytikas.sh mytikas-machine.sh
      - run: for file in public/*.js scripts/*.mjs scripts/machine/*.mjs; do node --check "$file" || exit 1; done
      - run: npm run test:helper
      - run: npm run test:public
      - run: node scripts/build-machine.mjs --check
      - run: npm run test:machine
      - run: npm run test:cloudflare
      - run: npm run test:landing
      - run: node tests/restore.mjs
      - run: node tests/check-coverage.mjs
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage:backend
      - run: npm run coverage:utilities
      - run: npm run test:demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-node
          path: |
            coverage/backend
            coverage/utilities
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          FRONTEND_COVERAGE: ${{ matrix.browser == 'chromium' && '1' || '0' }}
      - if: matrix.browser == 'chromium'
        run: node --import tsx tests/two-host.ts
      - if: matrix.browser == 'chromium'
        run: npm run test:visual
      - if: matrix.browser == 'chromium'
        run: FRONTEND_COVERAGE=1 npm run test:landing:browser
      - if: matrix.browser == 'chromium'
        run: npm run coverage:frontend
      - if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-browser
          path: coverage/frontend
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results
          retention-days: 7
  coverage:
    runs-on: ubuntu-24.04
    needs: [backend, browser]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-node
          path: coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-browser
          path: coverage/frontend
      - run: npm run coverage:check
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tests/recovery-container.mjs
      - run: npm run test:public:container
        env:
          IMAGE_ARCHIVE: /tmp/mytikas-tested.tar
      - run: npm run test:machine:container
      - run: npm run test:cloud:rehearsal
        env:
          REHEARSAL_IMAGE: mytikas-tested:latest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-container
          path: /tmp/mytikas-tested.tar
          retention-days: 2
  landing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node tests/landing.mjs
      - run: node scripts/build-landing.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: landing-dist
  image-security:
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-container
          path: /tmp
      - name: Scan the tested image and generate inventory
        run: |
          mkdir image-security
          docker run --rm -v /tmp/mytikas-tested.tar:/scan/image.tar:ro -v "$PWD/image-security:/reports" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --no-progress --scanners vuln --list-all-pkgs --format json --output /reports/vulnerabilities.json --input /scan/image.tar
          docker run --rm -v "$PWD/image-security:/reports" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb convert --format cyclonedx --output /reports/inventory.cdx.json /reports/vulnerabilities.json
      - name: Reject fixable high and critical findings
        run: |
          python3 - <<'PY'
          import json
          with open('image-security/vulnerabilities.json') as f:
              report = json.load(f)
          assert report.get('Results'), 'Missing image scan results'
          findings = [v for r in report['Results'] for v in r.get('Vulnerabilities', [])]
          blocking = [v for v in findings if v.get('FixedVersion') and v['Severity'] in ['HIGH', 'CRITICAL']]
          print('Findings:', len(findings), 'Fixable high/critical:', len(blocking))
          assert not blocking, [(v['VulnerabilityID'], v['PkgName']) for v in blocking]
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security
          path: image-security
          if-no-files-found: error
          retention-days: 30
  ci-required:
    if: always()
    needs: [quality, backend, browser, coverage, container, image-security, landing]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all mandatory jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs and all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: ci-required
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-required
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-container
          path: /tmp
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          docker load -i /tmp/mytikas-tested.tar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          IMAGE_REF="ghcr.io/laymer/mytikas:$COMMIT_SHA"
          TESTED_ID=$(docker image inspect --format '{{.Id}}' mytikas-tested:latest)
          if docker manifest inspect "$IMAGE_REF" >/tmp/existing-manifest.json 2>/tmp/manifest-error; then
            docker pull "$IMAGE_REF"
            EXISTING_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")
            test "$EXISTING_ID" = "$TESTED_ID" || { echo 'Refusing to overwrite an immutable commit tag with a different image'; exit 1; }
          else
            grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error || { echo 'Registry lookup failed; refusing publication'; exit 1; }
            docker tag mytikas-tested:latest "$IMAGE_REF"
            docker push "$IMAGE_REF"
          fi
          docker inspect --format '{{json .RepoDigests}}' "ghcr.io/laymer/mytikas:$COMMIT_SHA" > image-digest.json
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest
          path: image-digest.json
          retention-days: 30

  machine-launcher:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sha256sum mytikas-machine.sh > mytikas-machine.sh.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mytikas-machine-${{ github.sha }}
          path: |
            mytikas-machine.sh
            mytikas-machine.sh.sha256
            docs/MACHINE-MIGRATION.md
          retention-days: 90
