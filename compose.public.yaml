x-backend: &backend
  build: .
  image: mytikas-public
  init: true
  environment: &environment
    NODE_ENV: production
    DEPLOYMENT_PROFILE: public
    MYTIKAS_DEMO: "0"
    INGRESS_MODE: cloudflare-loopback
    DATABASE_URL: postgres://mytikas_runtime:${RUNTIME_DATABASE_PASSWORD:?Run public init}@db:5432/mytikas_public
    SESSION_SECRET: ${SESSION_SECRET:?Run public init}
    APP_ORIGIN: https://app.mytikas.monster
    PUBLIC_SITE_ORIGIN: https://mytikas.monster
    PORT: 8080
    EMAIL_OUTBOX_KEY: ${EMAIL_OUTBOX_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  restart: unless-stopped
  stop_grace_period: 45s
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: mytikas_public
      POSTGRES_DB: mytikas_public
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run public init}
    volumes:
      - public-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mytikas_public -d mytikas_public"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [node, dist/migrate.js]
    environment:
      <<: *environment
      DATABASE_URL: postgres://mytikas_public:${POSTGRES_PASSWORD:?Run public init}@db:5432/mytikas_public
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  runtime-grants:
    image: postgres:18-bookworm
    command: [psql, -X, -q, -v, ON_ERROR_STOP=1, -f, /scripts/public-runtime-role.sql]
    environment:
      PGHOST: db
      PGUSER: mytikas_public
      PGDATABASE: mytikas_public
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run public init}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Run public init}
    volumes:
      - ./scripts/public-runtime-role.sql:/scripts/public-runtime-role.sql:ro
      - ./scripts/runtime-grants.sql:/scripts/runtime-grants.sql:ro
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
  app:
    <<: *backend
    depends_on:
      runtime-grants:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    command: [node, dist/worker.js]
    healthcheck:
      test: [CMD, node, dist/worker-health.js]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      runtime-grants:
        condition: service_completed_successfully
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    user: "${PUBLIC_UID:?Run public init}:${PUBLIC_GID:?Run public init}"
    network_mode: service:app
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
secrets:
  tunnel_token:
    file: ./.public/tunnel-token
volumes:
  public-postgres-data:
